name: SEO — haftalık denetim ve bildirim

on:
  schedule:
    # Her pazartesi 06:00 (Türkiye saati) — cron UTC olarak değerlendirilir.
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm run assets
      - run: npm run build

      - name: SEO denetim raporu
        id: audit
        run: |
          set +e
          npm run audit -- --report seo-report.md
          echo "status=$?" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: seo-report-${{ github.run_number }}
          path: seo-report.md

      - name: Sayfaları arama motorlarına yeniden bildir
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: npm run indexnow || echo "IndexNow atlandı"

      # Denetim hata bulduysa (çıkış kodu 1) takip için issue açar.
      - name: Hata varsa issue aç
        if: steps.audit.outputs.status != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('seo-report.md', 'utf8').slice(0, 60000);
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `SEO denetimi hata buldu — ${new Date().toISOString().slice(0,10)}`,
              body,
              labels: ['seo'],
            });
